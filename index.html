<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="%BASE_URL%logo.webp" />

    <script>
      ;(function () {
        try {
          var r = sessionStorage.getItem('__gh_redirect__')
          if (r) {
            sessionStorage.removeItem('__gh_redirect__')
            if (r.charAt(0) === '/') history.replaceState(null, '', r)
          }
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('cbt-theme')
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches
          var d = s ? s === 'dark' : m
          if (d) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = d ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <style>
      #static-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; overflow: hidden; will-change: opacity; transform: translateZ(0); transition: opacity 680ms cubic-bezier(0.22,1,0.36,1); -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      html.dark #static-splash { background: #020617; }
      #static-splash .ss-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #eff6ff 0%, #fff 60%, #f8fafc 100%); }
      html.dark #static-splash .ss-bg { background: linear-gradient(135deg, #0f172a 0%, #020617 60%, #0b1224 100%); }
      #static-splash .ss-dotgrid { position: absolute; inset: 0; opacity: 0.035; background-image: radial-gradient(circle at 1px 1px, rgb(100 116 139) 1px, transparent 0); background-size: 24px 24px; }
      html.dark #static-splash .ss-dotgrid { opacity: 0.055; }
      #static-splash .ss-blob { position: absolute; border-radius: 9999px; filter: blur(36px); opacity: .1; will-change: transform; transform: translateZ(0); }
      #static-splash .ss-blob2 { position: absolute; border-radius: 9999px; filter: blur(36px); opacity: .08; will-change: transform; transform: translateZ(0); }
      #static-splash .ss-ring { position: absolute; left: 50%; top: 50%; border-radius: 9999px; border: 1px solid rgba(13,134,143,0.12); transform: translate(-50%,-50%); }
      #static-splash .ss-ring2 { position: absolute; left: 50%; top: 50%; border-radius: 9999px; border: 1px solid rgba(13,134,143,0.06); transform: translate(-50%,-50%); }
      #static-splash .ss-inner { animation: ssEnter 600ms cubic-bezier(0.22,1,0.36,1) both; will-change: opacity, transform; }
      #static-splash .ss-logo-wrap { position: relative; animation: ssLogo 2.2s ease-in-out infinite; }
      #static-splash .ss-logo-glow { position: absolute; inset: 0; transform: scale(1.75); border-radius: 28px; background: rgba(59,130,246,0.14); filter: blur(30px); }
      html.dark #static-splash .ss-logo-glow { background: rgba(59,130,246,0.20); }
      #static-splash .ss-logo-card { position: relative; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px rgba(15,23,42,0.12), 0 1px 3px rgba(15,23,42,0.06); border: 1px solid rgba(226,232,240,0.7); }
      html.dark #static-splash .ss-logo-card { background: #fff; border-color: rgba(226,232,240,0.7); }
      #static-splash .ss-badge { position: absolute; right: -4px; bottom: -4px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.35); border: 3px solid #fff; animation: ssBadge 2s ease-in-out infinite; }
      html.dark #static-splash .ss-badge { border-color: #020617; }
      #static-splash .ss-title { margin-top: 28px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, #0f172a, #334155); -webkit-background-clip: text; background-clip: text; color: transparent; animation: ssText 0.6s ease-out 0.2s both; }
      html.dark #static-splash .ss-title { background: linear-gradient(90deg, #fff, #cbd5e1); -webkit-background-clip: text; background-clip: text; }
      #static-splash .ss-subtitle { margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #2563eb; animation: ssText 0.6s ease-out 0.3s both; }
      #static-splash .ss-desc { margin-top: 8px; max-width: 360px; font-size: 12px; line-height: 1.6; color: #64748b; animation: ssText 0.6s ease-out 0.4s both; }
      #static-splash .ss-dots { margin-top: 28px; display: flex; gap: 10px; animation: ssText 0.5s ease-out 0.5s both; }
      #static-splash .ss-dot { width: 8px; height: 8px; border-radius: 9999px; background: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,0.3); will-change: transform, opacity; transform: translateZ(0); animation: ssPulse 1.1s cubic-bezier(0.4,0,0.2,1) infinite; }
      #static-splash .ss-dot:nth-child(2) { animation-delay: .16s; }
      #static-splash .ss-dot:nth-child(3) { animation-delay: .32s; }
      #static-splash .ss-bar-wrap { position: relative; margin-top: 18px; width: 192px; height: 6px; border-radius: 9999px; background: rgba(226,232,240,0.9); padding: 2px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); animation: ssText 0.5s ease-out 0.55s both; }
      html.dark #static-splash .ss-bar-wrap { background: #1e293b; }
      #static-splash .ss-bar { width: 44%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #3b82f6, #0ea5e9, #2563eb); will-change: transform; transform: translateZ(0); animation: ssBar 1.15s cubic-bezier(0.4,0,0.6,1) infinite alternate; box-shadow: 0 0 10px rgba(59,130,246,0.4); }
      #static-splash .ss-loading { margin-top: 12px; font-size: 11px; font-weight: 500; letter-spacing: .04em; color: #94a3b8; animation: ssText 0.5s ease-out 0.6s both; }
      @keyframes ssEnter { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes ssPulse { 0%,100% { opacity: 1; transform: scale(1) translateY(0); } 50% { opacity: .42; transform: scale(.76) translateY(1px); } }
      @keyframes ssBar { 0% { transform: translateX(-18%); } 100% { transform: translateX(132%); } }
      @keyframes ssLogo { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
      @keyframes ssBadge { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.06) rotate(2deg); } }
      @keyframes ssText { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes ssFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-10px,12px); } }
      @media (prefers-reduced-motion: reduce) { #static-splash .ss-inner{animation:none} #static-splash .ss-dot, #static-splash .ss-bar, #static-splash .ss-logo-wrap, #static-splash .ss-badge { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="static-splash" aria-hidden="true">
      <div class="ss-bg" aria-hidden></div>
      <div class="ss-dotgrid" aria-hidden></div>
      <div class="ss-blob" style="top:-120px; right:-120px; width:620px; height:620px; background:#3b82f6; animation: ssFloat 8s ease-in-out infinite;"></div>
      <div class="ss-blob2" style="bottom:-160px; left:-160px; width:640px; height:640px; background:#0ea5e9; animation: ssFloat 9s ease-in-out infinite reverse;"></div>
      <div class="ss-ring" style="width:420px; height:420px; opacity:0.5;"></div>
      <div class="ss-ring2" style="width:360px; height:360px; opacity:0.3;"></div>
      <div class="ss-inner" style="position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 24px;">
        <div class="ss-logo-wrap">
          <div class="ss-logo-glow"></div>
          <div class="ss-logo-card">
            <img src="%BASE_URL%logo.webp" alt="Logo SMK AL-FATA" width="60" height="60" style="width:60px; height:60px; object-fit:contain;" onerror="this.onerror=null;var f=document.querySelector('link[rel=icon]');this.src=f&&f.href?f.href:(location.pathname.indexOf('/ujian/')===0?'/ujian/logo.webp':'/logo.webp')" />
          </div>
        </div>
        <div class="ss-title" id="ss-title">SMK AL-FATA CBT</div>
        <div class="ss-subtitle" id="ss-subtitle">Computer Based Test</div>
        <div class="ss-desc">Sistem Ujian Digital — Aman, Cepat, Terintegrasi untuk Guru &amp; Siswa</div>
        <div class="ss-dots" aria-label="Memuat">
          <span class="ss-dot"></span><span class="ss-dot"></span><span class="ss-dot"></span>
        </div>
        <div class="ss-bar-wrap">
          <div class="ss-bar"></div>
        </div>
        <div class="ss-loading">Memuat sistem ujian…</div>
      </div>
      <div style="position:absolute; bottom:20px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:0 16px;">
        <div id="ss-footer-school" style="font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#94a3b8;">SMK AL-FATA • v1.0 • Profesional • Aman • Cepat</div>
        <div id="ss-footer-app" style="font-size:11px; color:#94a3b8;">© 2026 SMK AL-FATA CBT</div>
      </div>
    </div>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('cbt-branding')
          if (raw) {
            var b = JSON.parse(raw)
            var t = document.getElementById('ss-title')
            var st = document.getElementById('ss-subtitle')
            var ft = document.getElementById('ss-footer-app')
            var fs = document.getElementById('ss-footer-school')
            var fallbackLogo = (function(){ var l=document.querySelector('link[rel="icon"]'); return l&&l.href?l.href:(location.pathname.indexOf('/ujian/')===0?location.origin+'/ujian/logo.webp':location.origin+'/logo.webp') })()
            var sanitizeLogo = function(u){ if(!u||typeof u!=='string')return null; var s=u.trim(); if(!s||s.indexOf('vcbt')!==-1||s.indexOf('logo.svg')!==-1||s.indexOf('favicon.svg')!==-1)return null; return s }
            var resolveLogo = function(u){ var c=sanitizeLogo(u); if(!c) return fallbackLogo; if(/^https?:\/\//i.test(c)||/^data:/i.test(c)||/^blob:/i.test(c)) return c; var n=c.replace(/^\.\//,'/'); if(n==='/logo.webp'||n==='logo.webp'||n==='/ujian/logo.webp'||n==='ujian/logo.webp') return fallbackLogo; return c }
            if (b.app_name) {
              if (t) t.textContent = b.app_name
              if (ft) ft.textContent = '© 2026 ' + b.app_name
              document.title = b.app_name
            }
            if (b.school_name) {
              if (st) st.textContent = b.school_name + ' • CBT'
              if (fs) fs.textContent = b.school_name + ' • v1.0 • Profesional • Aman • Cepat'
            }
            var cleanLogo = resolveLogo(b.logo_url)
            var bad = !sanitizeLogo(b.logo_url)
            if (!bad) {
              var img = document.querySelector('#static-splash img[alt="Logo SMK AL-FATA"]')
              if (img) { img.src = cleanLogo; img.onerror = function(){ this.onerror=null; this.src=fallbackLogo; } }
              var fav = document.querySelector('link[rel="icon"]')
              if (fav) fav.href = cleanLogo
            } else if (b.logo_url && String(b.logo_url).includes('vcbt')) {
              try { var c=JSON.parse(localStorage.getItem('cbt-branding')||'{}'); if(c.logo_url&&String(c.logo_url).includes('vcbt')){ c.logo_url=fallbackLogo; localStorage.setItem('cbt-branding', JSON.stringify(c)); } } catch(e){}
            } else if (bad && b.logo_url) {
              try { var d=JSON.parse(localStorage.getItem('cbt-branding')||'{}'); d.logo_url=fallbackLogo; localStorage.setItem('cbt-branding', JSON.stringify(d)); } catch(e){}
              var img2 = document.querySelector('#static-splash img[alt="Logo SMK AL-FATA"]')
              if (img2) { img2.src = fallbackLogo }
            }
            if (b.primary_color) {
              var pc = b.primary_color
              var sc = b.secondary_color || pc
              var dots = document.querySelectorAll('#static-splash .ss-dot')
              dots.forEach(function(d) { d.style.background = pc; d.style.boxShadow = '0 0 8px ' + pc + '66' })
              var bar = document.querySelector('#static-splash .ss-bar')
              if (bar) {
                bar.style.background = 'linear-gradient(90deg, ' + pc + ', ' + sc + ', ' + pc + ')'
                bar.style.boxShadow = '0 0 10px ' + pc + '66'
              }
              var sub = document.getElementById('ss-subtitle')
              if (sub) sub.style.color = pc
              var blob1 = document.querySelector('#static-splash .ss-blob')
              if (blob1) blob1.style.background = pc
              var blob2 = document.querySelector('#static-splash .ss-blob2')
              if (blob2) blob2.style.background = sc
              var glow = document.querySelector('#static-splash .ss-logo-glow')
              if (glow) glow.style.background = pc + '24'
              var ring = document.querySelector('#static-splash .ss-ring')
              if (ring) ring.style.borderColor = pc + '1f'
              var ring2 = document.querySelector('#static-splash .ss-ring2')
              if (ring2) ring2.style.borderColor = pc + '0f'
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta && /^#[0-9a-fA-F]{6}$/.test(pc)) meta.content = pc
            }
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
