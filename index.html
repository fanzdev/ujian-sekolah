    <script>
      ;(function () {
        try {
          var r = sessionStorage.getItem('__gh_redirect__')
          if (r) {
            sessionStorage.removeItem('__gh_redirect__')
            if (r.charAt(0) === '/') history.replaceState(null, '', r)
          }

    <script>
      ;(function () {
        try {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
          document.documentElement.style.removeProperty('--app-dark-bg')
          document.documentElement.style.removeProperty('--app-dark-bg-soft')
          if (document.body) document.body.style.backgroundColor = ''
          try { localStorage.setItem('cbt-theme','light') } catch(e){}
          var raw = localStorage.getItem('cbt-branding')
          var pc = '#0D868F'
          var login = '#0B1E24'
          var sidebar = '#0B1E24'
          var appBg = '#FDF9F3'
          var splash = '#0B1E24'
          if (raw) { try { var b=JSON.parse(raw); if(b.primary_color && /^#[0-9a-fA-F]{6}$/.test(b.primary_color)) pc=b.primary_color; if(b.login_color && /^#[0-9a-fA-F]{6}$/.test(b.login_color)) login=b.login_color; if(b.sidebar_color && /^#[0-9a-fA-F]{6}$/.test(b.sidebar_color)) sidebar=b.sidebar_color; if(b.app_bg_color && /^#[0-9a-fA-F]{6}$/.test(b.app_bg_color)) appBg=b.app_bg_color; if(b.splash_bg_color && /^#[0-9a-fA-F]{6}$/.test(b.splash_bg_color)) splash=b.splash_bg_color; document.documentElement.style.setProperty('--c-login-bg', login); document.documentElement.style.setProperty('--c-sidebar-bg', sidebar); document.documentElement.style.setProperty('--c-app-bg', appBg); document.documentElement.style.setProperty('--c-splash-bg', splash); document.documentElement.style.setProperty('--c-app-bg-hex', appBg); if(document.body) document.body.style.backgroundColor = appBg; document.documentElement.style.backgroundColor = appBg; var sp=document.getElementById('static-splash'); if(sp) sp.style.background = splash; var ssBg=document.querySelector('#static-splash .ss-bg'); if(ssBg) ssBg.style.background = 'radial-gradient(900px 600px at 50% -10%, '+pc+'18, transparent 60%), linear-gradient(180deg, '+splash+'f0 0%, '+splash+' 55%, '+splash+' 100%)'; } catch(e){} }
          var meta=document.querySelector('meta[name="theme-color"]')
          if(meta) meta.content = pc
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('cbt-branding')
          if (!raw) return
          var b = JSON.parse(raw)
          var pc = b.primary_color
          var sc = b.secondary_color || pc
          if (!pc || !/^#[0-9a-fA-F]{6}$/.test(pc)) return
          var css = ''
          css += '#static-splash .ss-dot{background:' + pc + '!important;box-shadow:0 0 8px ' + pc + '66!important}'
          css += '#static-splash .ss-bar{background:linear-gradient(90deg,' + pc + ',' + sc + ',' + pc + ')!important;box-shadow:0 0 10px ' + pc + '66!important}'
          css += '#static-splash .ss-subtitle{color:' + pc + '!important}'
          css += '#static-splash .ss-blob{background:' + pc + '!important}'
          css += '#static-splash .ss-blob2{background:' + sc + '!important}'
          css += '#static-splash .ss-logo-glow{background:' + pc + '24!important}'
          css += '#static-splash .ss-ring{border-color:' + pc + '1f!important}'
          css += '#static-splash .ss-ring2{border-color:' + pc + '0f!important}'
          var el = document.createElement('style')
          el.id = 'ss-branding-early'
          el.textContent = css
          document.head.appendChild(el)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = pc
        } catch (e) {}
      })()
    </script>
     <style>
      #static-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--c-splash-bg, #0B1E24); overflow: hidden; will-change: opacity; transform: translateZ(0); transition: opacity 680ms cubic-bezier(0.22,1,0.36,1); -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      #static-splash .ss-bg { position: absolute; inset: 0; background: radial-gradient(900px 600px at 50% -10%, color-mix(in srgb, var(--c-splash-bg, #0B1E24) 18%, transparent), transparent 60%), linear-gradient(180deg, color-mix(in srgb, var(--c-splash-bg, #0B1E24) 94%, white) 0%, var(--c-splash-bg, #0B1E24) 55%, color-mix(in srgb, var(--c-splash-bg, #0B1E24) 88%, black) 100%); }
      #static-splash .ss-dotgrid { position: absolute; inset: 0; opacity: 0.05; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.9) 1px, transparent 0); background-size: 24px 24px; }
      #static-splash .ss-blob { position: absolute; border-radius: 9999px; filter: blur(40px); opacity: .14; will-change: transform; transform: translateZ(0); }
      #static-splash .ss-blob2 { position: absolute; border-radius: 9999px; filter: blur(36px); opacity: .10; will-change: transform; transform: translateZ(0); }
      #static-splash .ss-ring { position: absolute; left: 50%; top: 50%; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.08); transform: translate(-50%,-50%); }
      #static-splash .ss-ring2 { position: absolute; left: 50%; top: 50%; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.05); transform: translate(-50%,-50%); }
      #static-splash .ss-ghost { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); font-size: clamp(110px, 26vw, 220px); font-weight: 900; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1.2px rgba(255,255,255,0.07); user-select: none; pointer-events: none; }
      #static-splash .ss-inner { animation: ssEnter 700ms cubic-bezier(0.22,1,0.36,1) both; will-change: opacity, transform; }
      #static-splash .ss-logo-wrap { position: relative; animation: ssLogo 2.4s ease-in-out infinite; }
      #static-splash .ss-logo-glow { position: absolute; inset: 0; transform: scale(1.7); border-radius: 28px; background: rgba(198,124,59,0.18); filter: blur(28px); }
      #static-splash .ss-logo-card { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #fff; box-shadow: 0 16px 48px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.12); border: 1px solid rgba(255,255,255,0.9); }
      #static-splash .ss-title { margin-top: 28px; font-size: 23px; font-weight: 900; letter-spacing: -0.03em; color: #fff; animation: ssText 0.6s ease-out 0.2s both; text-shadow: 0 1px 2px rgba(0,0,0,0.12); }
      #static-splash .ss-subtitle { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #E8B86A; animation: ssText 0.6s ease-out 0.3s both; }
      #static-splash .ss-desc { margin-top: 10px; max-width: 360px; font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.62); animation: ssText 0.6s ease-out 0.4s both; }
      #static-splash .ss-dots { margin-top: 28px; display: flex; gap: 10px; animation: ssText 0.5s ease-out 0.5s both; }
      #static-splash .ss-dot { width: 8px; height: 8px; border-radius: 9999px; background: #C67C3B; box-shadow: 0 0 10px rgba(198,124,59,0.45); will-change: transform, opacity; transform: translateZ(0); animation: ssPulse 1.1s cubic-bezier(0.4,0,0.2,1) infinite; }
      #static-splash .ss-dot:nth-child(2) { animation-delay: .16s; }
      #static-splash .ss-dot:nth-child(3) { animation-delay: .32s; }
      #static-splash .ss-bar-wrap { position: relative; margin-top: 18px; width: 200px; height: 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); padding: 2px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.18); animation: ssText 0.5s ease-out 0.55s both; }
      #static-splash .ss-bar { width: 44%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #0D868F, #C67C3B, #0D868F); will-change: transform; transform: translateZ(0); animation: ssBar 1.2s cubic-bezier(0.4,0,0.6,1) infinite alternate; box-shadow: 0 0 10px rgba(13,134,143,0.5); }
      #static-splash .ss-loading { margin-top: 12px; font-size: 11px; font-weight: 500; letter-spacing: .06em; color: rgba(255,255,255,0.55); animation: ssText 0.5s ease-out 0.6s both; font-family: "Fragment Mono", ui-monospace, monospace; }
      @keyframes ssEnter { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes ssPulse { 0%,100% { opacity: 1; transform: scale(1) translateY(0); } 50% { opacity: .45; transform: scale(.78) translateY(1px); } }
      @keyframes ssBar { 0% { transform: translateX(-18%); } 100% { transform: translateX(132%); } }
      @keyframes ssLogo { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.02) rotate(0.3deg); } }
      @keyframes ssText { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes ssFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-12px,14px); } }
      @media (prefers-reduced-motion: reduce) { #static-splash .ss-inner{animation:none} #static-splash .ss-dot, #static-splash .ss-bar, #static-splash .ss-logo-wrap { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="static-splash" aria-hidden="true">
      <div class="ss-bg" aria-hidden></div>
      <div class="ss-dotgrid" aria-hidden></div>
      <div class="ss-ghost" aria-hidden>VEYRA</div>
      <div class="ss-blob" style="top:-120px; right:-120px; width:640px; height:640px; background:#0D868F; animation: ssFloat 8s ease-in-out infinite;"></div>
      <div class="ss-blob2" style="bottom:-160px; left:-160px; width:640px; height:640px; background:#C67C3B; animation: ssFloat 9s ease-in-out infinite reverse;"></div>
      <div class="ss-ring" style="width:440px; height:440px; opacity:0.5;"></div>
      <div class="ss-ring2" style="width:360px; height:360px; opacity:0.3;"></div>
      <div class="ss-inner" style="position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 24px;">
        <div class="ss-logo-wrap">
          <div class="ss-logo-glow"></div>
          <div class="ss-logo-card">
            <img src="%BASE_URL%logo.webp" alt="Logo Veyra CBT" width="60" height="60" style="width:60px; height:60px; object-fit:contain;" onerror="this.onerror=null;var f=document.querySelector('link[rel=icon]');this.src=f&&f.href?f.href:(location.pathname.indexOf('/ujian/')===0?'/ujian/logo.webp':'/logo.webp')" />
          </div>
        </div>
        <div class="ss-title" id="ss-title">Veyra CBT</div>
        <div class="ss-subtitle" id="ss-subtitle">Computer Based Test</div>
        <div class="ss-desc">Sistem Ujian Digital — Aman, Cepat, Terintegrasi untuk Guru &amp; Siswa</div>
        <div class="ss-dots" aria-label="Memuat">
          <span class="ss-dot"></span><span class="ss-dot"></span><span class="ss-dot"></span>
        </div>
        <div class="ss-bar-wrap">
          <div class="ss-bar"></div>
        </div>
        <div class="ss-loading">Memuat sistem ujian…</div>
      </div>
      <div style="position:absolute; bottom:20px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:0 16px;">
        <div id="ss-footer-school" style="font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#94a3b8;">SMK AL-FATA • v1.0 • Profesional • Aman • Cepat</div>
        <div id="ss-footer-app" style="font-size:11px; color:#94a3b8;">© 2026 Veyra CBT</div>
      </div>
    </div>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('cbt-branding')
          if (raw) {
            var b = JSON.parse(raw)
            var t = document.getElementById('ss-title')
            var st = document.getElementById('ss-subtitle')
            var ft = document.getElementById('ss-footer-app')
            var fs = document.getElementById('ss-footer-school')
            var fallbackLogo = (function(){ var l=document.querySelector('link[rel="icon"]'); return l&&l.href?l.href:(location.pathname.indexOf('/ujian/')===0?location.origin+'/ujian/logo.webp':location.origin+'/logo.webp') })()
            var sanitizeLogo = function(u){ if(!u||typeof u!=='string')return null; var s=u.trim(); if(!s||s.indexOf('vcbt')!==-1||s.indexOf('logo.svg')!==-1||s.indexOf('favicon.svg')!==-1)return null; return s }
            var resolveLogo = function(u){ var c=sanitizeLogo(u); if(!c) return fallbackLogo; if(/^https?:\/\//i.test(c)||/^data:/i.test(c)||/^blob:/i.test(c)) return c; var n=c.replace(/^\.\//,'/'); if(n==='/logo.webp'||n==='logo.webp'||n==='/ujian/logo.webp'||n==='ujian/logo.webp') return fallbackLogo; return c }
            if (b.app_name) {
              if (t) t.textContent = b.app_name
              if (ft) ft.textContent = '© 2026 ' + b.app_name
              document.title = b.app_name
            }
            if (b.school_name) {
              if (st) st.textContent = b.school_name + ' • CBT'
              if (fs) fs.textContent = b.school_name + ' • v1.0 • Profesional • Aman • Cepat'
            }
            var cleanLogo = resolveLogo(b.logo_url)
            var bad = !sanitizeLogo(b.logo_url)
            if (!bad) {
              var img = document.querySelector('#static-splash img[alt^="Logo"]')
              if (img) { img.src = cleanLogo; img.alt = 'Logo ' + (b.app_name || 'Veyra CBT'); img.onerror = function(){ this.onerror=null; this.src=fallbackLogo; } }
              var fav = document.querySelector('link[rel="icon"]')
              if (fav) fav.href = cleanLogo
            } else if (b.logo_url && String(b.logo_url).includes('vcbt')) {
              try { var c=JSON.parse(localStorage.getItem('cbt-branding')||'{}'); if(c.logo_url&&String(c.logo_url).includes('vcbt')){ c.logo_url=fallbackLogo; localStorage.setItem('cbt-branding', JSON.stringify(c)); } } catch(e){}
            } else if (bad && b.logo_url) {
              try { var d=JSON.parse(localStorage.getItem('cbt-branding')||'{}'); d.logo_url=fallbackLogo; localStorage.setItem('cbt-branding', JSON.stringify(d)); } catch(e){}
              var img2 = document.querySelector('#static-splash img[alt^="Logo"]')
              if (img2) { img2.src = fallbackLogo }
            }
            var splashBg = b.splash_bg_color && /^#[0-9a-fA-F]{6}$/.test(b.splash_bg_color) ? b.splash_bg_color : null
            var appBg = b.app_bg_color && /^#[0-9a-fA-F]{6}$/.test(b.app_bg_color) ? b.app_bg_color : null
            if (splashBg) {
              var splashEl = document.getElementById('static-splash')
              if (splashEl) splashEl.style.background = splashBg
              var ssBgEl = document.querySelector('#static-splash .ss-bg')
              if (ssBgEl && b.primary_color) ssBgEl.style.background = 'radial-gradient(900px 600px at 50% -10%, ' + b.primary_color + '18, transparent 60%), linear-gradient(180deg, ' + splashBg + 'f0 0%, ' + splashBg + ' 55%, ' + splashBg + ' 100%)'
              document.documentElement.style.setProperty('--c-splash-bg', splashBg)
              if (document.body) document.body.style.backgroundColor = appBg || document.body.style.backgroundColor
            }
            if (appBg) {
              document.documentElement.style.setProperty('--c-app-bg', appBg)
              document.documentElement.style.setProperty('--c-app-bg-hex', appBg)
              document.documentElement.style.backgroundColor = appBg
              if (document.body) document.body.style.backgroundColor = appBg
            }
            if (b.login_color && /^#[0-9a-fA-F]{6}$/.test(b.login_color)) document.documentElement.style.setProperty('--c-login-bg', b.login_color)
            if (b.sidebar_color && /^#[0-9a-fA-F]{6}$/.test(b.sidebar_color)) document.documentElement.style.setProperty('--c-sidebar-bg', b.sidebar_color)
            if (b.primary_color) {
              var pc = b.primary_color
              var sc = b.secondary_color || pc
              var dots = document.querySelectorAll('#static-splash .ss-dot')
              dots.forEach(function(d) { d.style.background = pc; d.style.boxShadow = '0 0 8px ' + pc + '66' })
              var bar = document.querySelector('#static-splash .ss-bar')
              if (bar) {
                bar.style.background = 'linear-gradient(90deg, ' + pc + ', ' + sc + ', ' + pc + ')'
                bar.style.boxShadow = '0 0 10px ' + pc + '66'
              }
              var sub = document.getElementById('ss-subtitle')
              if (sub) sub.style.color = pc
              var blob1 = document.querySelector('#static-splash .ss-blob')
              if (blob1) blob1.style.background = pc
              var blob2 = document.querySelector('#static-splash .ss-blob2')
              if (blob2) blob2.style.background = sc
              var glow = document.querySelector('#static-splash .ss-logo-glow')
              if (glow) glow.style.background = pc + '24'
              var ring = document.querySelector('#static-splash .ss-ring')
              if (ring) ring.style.borderColor = pc + '1f'
              var ring2 = document.querySelector('#static-splash .ss-ring2')
              if (ring2) ring2.style.borderColor = pc + '0f'
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta && /^#[0-9a-fA-F]{6}$/.test(pc)) meta.content = pc
            }
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
